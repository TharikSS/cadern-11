@font-face{font-family:'Barlow Condensed';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}

<style>
/* Layout: coluna única estreita, como uma caderneta de obra: resumo, lançamento, registros, gráfico, exportação. */
:root {
  --bg: #EDF0EC;
  --fg: #16211C;
  --muted: #5A6860;
  --line: #CBD3CC;
  --field: #FBFCFA;
  --accent: #1D5A47;
  --accent-fg: #F7F9F6;
  --pending: #A85F00;
  --danger: #A8362B;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --fg: #E7ECE8; --muted: #97A59C; --line: #2E3A33; --field: #0D120F;
    --accent: #5FC7A2; --accent-fg: #0E1712; --pending: #E3A44B; --danger: #F08A7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --fg: #E7ECE8; --muted: #97A59C; --line: #2E3A33; --field: #0D120F;
  --accent: #5FC7A2; --accent-fg: #0E1712; --pending: #E3A44B; --danger: #F08A7E;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 24px 48px; }
main { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 36px; }
h1, h2, p, dl, dd, ul { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin-top: 6px; text-wrap: balance; }
.sec-h { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
.sec-h::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

/* Resumo */
.sum { border-top: 2px solid var(--fg); }
.sum > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sum dt { font-weight: 500; min-width: 0; }
.sum dt small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
.sum dd { font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.sum .is-pending dd { color: var(--pending); }

/* Formulário */
form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12.5px; font-weight: 500; letter-spacing: .03em; color: var(--muted); }
input[type="date"], input[type="text"], input[type="number"], textarea, select {
  font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.btn { font: inherit; font-weight: 600; min-height: 44px; padding: 10px 18px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn:first-child { flex: 1 1 180px; }
.err { color: var(--danger); font-size: 13.5px; min-height: 1em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Registros */
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.seg button { font: inherit; font-size: 13.5px; padding: 6px 12px; min-height: 36px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.entries { list-style: none; padding: 0; }
.entries li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.day { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: .9; grid-row: span 2; }
.day small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.place { font-weight: 600; overflow-wrap: anywhere; }
.desc { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.val { font-family: var(--font-mono); font-size: 14.5px; text-align: right; font-variant-numeric: tabular-nums; }
.tag { justify-self: end; align-self: start; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 1px 7px; border: 1px solid currentColor; border-radius: 3px; }
.tag.paid { color: var(--accent); }
.tag.pend { color: var(--pending); }
.ops { grid-column: 2 / -1; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.link { font: inherit; font-size: 13.5px; background: none; border: 0; padding: 8px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link.danger { color: var(--danger); }
.ask { font-size: 13.5px; }
.empty { color: var(--muted); padding: 18px 0; border-bottom: 1px solid var(--line); }

/* Gráfico */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); font-size: 10px; fill: var(--muted); }
.chart text.cur { fill: var(--fg); font-weight: 600; }
.chart .tot { fill: var(--fg); font-family: var(--font-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .paid { fill: var(--accent); }
.chart .pend { fill: var(--pending); }
.legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }

/* Exportar */
.export { display: flex; flex-direction: column; gap: 14px; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.2em; }
.note { color: var(--muted); font-size: 13px; }
.warn { font-size: 13px; padding: 10px 12px; border: 1px solid var(--pending); color: var(--pending); border-radius: 4px; }
</style>

</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="today"></p>
    <h1>Cadern-11</h1>
  </header>

  <p class="warn" id="storeWarn" hidden>Este navegador não permite guardar dados. Os registros somem ao fechar a página. Use o backup na seção Exportar.</p>

  <section aria-labelledby="h-resumo">
    <h2 class="sec-h" id="h-resumo">Resumo</h2>
    <dl class="sum" id="sum"></dl>
  </section>

  <section aria-labelledby="h-nova">
    <h2 class="sec-h" id="h-nova"><span id="formTitle">Nova diária</span></h2>
    <form id="form" novalidate>
      <div class="row2">
        <div class="field"><label for="fDate">Data</label><input type="date" id="fDate" required></div>
        <div class="field"><label for="fValue">Valor da diária (R$)</label><input type="number" id="fValue" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required></div>
      </div>
      <div class="field"><label for="fPlace">Local ou cliente</label><input type="text" id="fPlace" list="places" autocomplete="off" required></div>
      <datalist id="places"></datalist>
      <div class="field"><label for="fDesc">Descrição do serviço</label><textarea id="fDesc" rows="2"></textarea></div>
      <label class="check"><input type="checkbox" id="fPaid"> Já recebi este valor</label>
      <p class="err" id="formError" role="alert"></p>
      <div class="actions">
        <button class="btn" type="submit" id="fSubmit">Registrar diária</button>
        <button class="btn ghost" type="button" id="fCancel" hidden>Cancelar edição</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="h-reg">
    <h2 class="sec-h" id="h-reg">Registros</h2>
    <div class="seg" id="filters">
      <button type="button" data-f="all" aria-pressed="true">Todas</button>
      <button type="button" data-f="pend" aria-pressed="false">Pendentes</button>
      <button type="button" data-f="paid" aria-pressed="false">Pagas</button>
    </div>
    <p class="count" id="count"></p>
    <ul class="entries" id="entries"></ul>
  </section>

  <section aria-labelledby="h-graf">
    <h2 class="sec-h" id="h-graf">Ganhos</h2>
    <div class="seg" id="modes">
      <button type="button" data-m="weeks" aria-pressed="true">Por semana</button>
      <button type="button" data-m="months" aria-pressed="false">Por mês</button>
    </div>
    <div id="chart"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Recebido</span><span><i style="background:var(--pending)"></i>A receber</span></div>
  </section>

  <section aria-labelledby="h-exp">
    <h2 class="sec-h" id="h-exp">Exportar</h2>
    <div class="export">
      <div class="field"><label for="period">Período do relatório</label><select id="period"></select></div>
      <div class="actions" id="exportBtns">
        <button class="btn" type="button" id="bPdf">Baixar PDF</button>
        <button class="btn ghost" type="button" id="bCsv">Baixar planilha</button>
      </div>
      <p class="note" id="noDl" hidden>O download de arquivos não está disponível nesta visualização.</p>
      <div class="actions" id="backupBtns">
        <button class="link" type="button" id="bBackup">Salvar backup (.json)</button>
        <button class="link" type="button" id="bRestore">Restaurar backup</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = 'caderneta-diarias.v1';
  var brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var compact = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
  var MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var MON3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var WD3 = ['dom','seg','ter','qua','qui','sex','sáb'];

  var records = [];
  var editingId = null, confirmId = null, filter = 'all', mode = 'weeks';
  var memory = null, storageOk = true;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function br(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function short(s) { var p = s.split('-'); return p[2] + '/' + p[1]; }
  function weekStart(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n) { return n + (n === 1 ? ' diária' : ' diárias'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sum(list) { return list.reduce(function (a, r) { return a + r.value; }, 0); }
  function monthLabel(key) { var p = key.split('-'); return cap(MONTHS[Number(p[1]) - 1]) + ' de ' + p[0]; }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* Armazenamento */
  function load() {
    try {
      var t = window.localStorage; t.setItem('__t', '1'); t.removeItem('__t');
      var raw = t.getItem(KEY);
      if (raw) records = JSON.parse(raw) || [];
    } catch (e) { storageOk = false; records = memory || []; }
    if (!storageOk) $('storeWarn').hidden = false;
  }
  function persist() {
    memory = records;
    if (!storageOk) return;
    try { window.localStorage.setItem(KEY, JSON.stringify(records)); }
    catch (e) { storageOk = false; $('storeWarn').hidden = false; }
  }

  /* Resumo */
  function renderSummary() {
    var now = new Date(), ws = weekStart(now), we = new Date(ws); we.setDate(ws.getDate() + 6);
    var a = ymd(ws), b = ymd(we), mk = ymd(now).slice(0, 7);
    var wk = records.filter(function (r) { return r.date >= a && r.date <= b; });
    var mo = records.filter(function (r) { return r.date.slice(0, 7) === mk; });
    var pe = records.filter(function (r) { return !r.paid; });
    $('sum').innerHTML =
      '<div><dt>Esta semana<small>' + short(a) + ' a ' + short(b) + ' · ' + plural(wk.length) + '</small></dt><dd>' + brl.format(sum(wk)) + '</dd></div>' +
      '<div><dt>Este mês<small>' + monthLabel(mk).toLowerCase() + ' · ' + plural(mo.length) + '</small></dt><dd>' + brl.format(sum(mo)) + '</dd></div>' +
      '<div class="is-pending"><dt>A receber<small>' + plural(pe.length) + ' pendente' + (pe.length === 1 ? '' : 's') + '</small></dt><dd>' + brl.format(sum(pe)) + '</dd></div>';
  }

  /* Lista */
  function visible() {
    return records.filter(function (r) { return filter === 'all' || (filter === 'pend' ? !r.paid : r.paid); })
      .sort(function (x, y) { return x.date < y.date ? 1 : x.date > y.date ? -1 : (x.id < y.id ? 1 : -1); });
  }
  function renderList() {
    var list = visible();
    $('count').textContent = list.length ? plural(list.length) + ' · ' + brl.format(sum(list)) : '';
    if (!list.length) {
      $('entries').innerHTML = '<li class="empty" style="display:block">' + (records.length ? 'Nenhuma diária neste filtro.' : 'Nenhuma diária registrada ainda. Preencha o formulário acima para lançar a primeira.') + '</li>';
      return;
    }
    $('entries').innerHTML = list.map(function (r) {
      var d = parse(r.date);
      var ops = confirmId === r.id
        ? '<span class="ask">Excluir esta diária?</span><button class="link danger" data-act="delyes" data-id="' + r.id + '">Sim, excluir</button><button class="link" data-act="delno" data-id="' + r.id + '">Cancelar</button>'
        : '<button class="link" data-act="pay" data-id="' + r.id + '">' + (r.paid ? 'Marcar como pendente' : 'Marcar como pago') + '</button><button class="link" data-act="edit" data-id="' + r.id + '">Editar</button><button class="link danger" data-act="del" data-id="' + r.id + '">Excluir</button>';
      return '<li><div class="day">' + pad(d.getDate()) + '<small>' + WD3[d.getDay()] + ' · ' + MON3[d.getMonth()] + '</small></div>' +
        '<div class="place">' + esc(r.place) + '</div><div class="val">' + brl.format(r.value) + '</div>' +
        '<div class="desc">' + esc(r.desc || 'Sem descrição') + '</div><span class="tag ' + (r.paid ? 'paid' : 'pend') + '">' + (r.paid ? 'Pago' : 'Pendente') + '</span>' +
        '<div class="ops">' + ops + '</div></li>';
    }).join('');
  }

  /* Gráfico */
  function niceMax(v) {
    if (v <= 0) return 100;
    var e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
  }
  function buckets() {
    var out = [], now = new Date(), i;
    if (mode === 'weeks') {
      var ws = weekStart(now);
      for (i = 7; i >= 0; i--) {
        var s = new Date(ws); s.setDate(ws.getDate() - 7 * i);
        var e = new Date(s); e.setDate(s.getDate() + 6);
        out.push({ label: short(ymd(s)), a: ymd(s), b: ymd(e), cur: i === 0 });
      }
    } else {
      for (i = 5; i >= 0; i--) {
        var m = new Date(now.getFullYear(), now.getMonth() - i, 1);
        var k = ymd(m).slice(0, 7);
        out.push({ label: MON3[m.getMonth()], a: k + '-01', b: k + '-31', cur: i === 0 });
      }
    }
    out.forEach(function (bk) {
      var inb = records.filter(function (r) { return r.date >= bk.a && r.date <= bk.b; });
      bk.paid = sum(inb.filter(function (r) { return r.paid; }));
      bk.pend = sum(inb.filter(function (r) { return !r.paid; }));
    });
    return out;
  }
  function renderChart() {
    var bk = buckets(), W = 360, H = 200, L = 46, R = 8, T = 18, B = 26;
    var pw = W - L - R, ph = H - T - B, n = bk.length, band = pw / n, bw = band * 0.6;
    var max = niceMax(Math.max.apply(null, bk.map(function (x) { return x.paid + x.pend; })));
    var any = bk.some(function (x) { return x.paid + x.pend > 0; });
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ganhos ' + (mode === 'weeks' ? 'por semana, últimas 8 semanas' : 'por mês, últimos 6 meses') + '">';
    [0, 0.5, 1].forEach(function (g) {
      var y = T + ph - g * ph;
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + (g === 0 ? '0' : compact.format(max * g)) + '</text>';
    });
    bk.forEach(function (x, i) {
      var cx = L + band * i + band / 2, hp = x.paid / max * ph, hn = x.pend / max * ph, base = T + ph;
      if (x.paid > 0) s += '<rect class="paid" x="' + (cx - bw / 2) + '" y="' + (base - hp) + '" width="' + bw + '" height="' + hp + '"/>';
      if (x.pend > 0) s += '<rect class="pend" x="' + (cx - bw / 2) + '" y="' + (base - hp - hn) + '" width="' + bw + '" height="' + hn + '"/>';
      if (x.paid + x.pend > 0) s += '<text class="tot" x="' + cx + '" y="' + (base - hp - hn - 4) + '" text-anchor="middle">' + compact.format(x.paid + x.pend) + '</text>';
      s += '<text' + (x.cur ? ' class="cur"' : '') + ' x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + x.label + '</text>';
    });
    if (!any) s += '<text x="' + (L + pw / 2) + '" y="' + (T + ph / 2) + '" text-anchor="middle">Sem registros neste período</text>';
    $('chart').innerHTML = s + '</svg>';
  }

  /* Campos auxiliares */
  function renderPlaces() {
    var seen = {}, html = '';
    records.forEach(function (r) { if (!seen[r.place]) { seen[r.place] = 1; html += '<option value="' + esc(r.place) + '">'; } });
    $('places').innerHTML = html;
  }
  function renderPeriods() {
    var keep = $('period').value, keys = {}, cur = ymd(new Date()).slice(0, 7);
    keys[cur] = 1;
    records.forEach(function (r) { keys[r.date.slice(0, 7)] = 1; });
    var html = '<option value="all">Todos os registros</option>' + Object.keys(keys).sort().reverse().map(function (k) { return '<option value="' + k + '">' + monthLabel(k) + '</option>'; }).join('');
    $('period').innerHTML = html;
    $('period').value = keep && $('period').querySelector('option[value="' + keep + '"]') ? keep : cur;
  }
  function render() { renderSummary(); renderList(); renderChart(); renderPlaces(); renderPeriods(); }

  /* Formulário */
  function resetForm() {
    editingId = null;
    $('fPlace').value = ''; $('fDesc').value = ''; $('fValue').value = ''; $('fPaid').checked = false;
    $('formTitle').textContent = 'Nova diária'; $('fSubmit').textContent = 'Registrar diária'; $('fCancel').hidden = true;
    $('formError').textContent = '';
  }
  $('fDate').value = ymd(new Date());
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var date = $('fDate').value, place = $('fPlace').value.trim();
    var value = Math.round(parseFloat(String($('fValue').value).replace(',', '.')) * 100) / 100;
    if (!date) return ($('formError').textContent = 'Informe a data.');
    if (!place) return ($('formError').textContent = 'Informe o local ou cliente.');
    if (!isFinite(value) || value <= 0) return ($('formError').textContent = 'Informe um valor maior que zero.');
    var rec = { id: editingId || newId(), date: date, place: place, desc: $('fDesc').value.trim(), value: value, paid: $('fPaid').checked };
    if (editingId) records = records.map(function (r) { return r.id === editingId ? rec : r; });
    else records.push(rec);
    var wasEdit = !!editingId;
    persist(); resetForm(); render();
    $('status').textContent = wasEdit ? 'Alterações salvas.' : 'Diária registrada.';
    if (!wasEdit) $('fPlace').focus();
  });
  $('fCancel').addEventListener('click', resetForm);

  /* Lista: ações */
  $('entries').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]'); if (!btn) return;
    var id = btn.dataset.id, act = btn.dataset.act;
    var r = records.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    if (act === 'pay') { r.paid = !r.paid; persist(); }
    else if (act === 'del') confirmId = id;
    else if (act === 'delno') confirmId = null;
    else if (act === 'delyes') { records = records.filter(function (x) { return x.id !== id; }); confirmId = null; persist(); }
    else if (act === 'edit') {
      editingId = id; $('fDate').value = r.date; $('fPlace').value = r.place; $('fDesc').value = r.desc; $('fValue').value = r.value; $('fPaid').checked = r.paid;
      $('formTitle').textContent = 'Editar diária'; $('fSubmit').textContent = 'Salvar alterações'; $('fCancel').hidden = false;
      $('form').scrollIntoView({ block: 'start' }); $('fPlace').focus();
    }
    render();
  });
  $('filters').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-f]'); if (!b) return;
    filter = b.dataset.f;
    Array.prototype.forEach.call($('filters').children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    renderList();
  });
  $('modes').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-m]'); if (!b) return;
    mode = b.dataset.m;
    Array.prototype.forEach.call($('modes').children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    renderChart();
  });

  /* Exportação */
  var MIME = { pdf: 'application/pdf', csv: 'text/csv;charset=utf-8', json: 'application/json' };
  var dlPromise = Promise.resolve({
    save: function (req) {
      return new Promise(function (resolve, reject) {
        try {
          var ext = req.filename.split('.').pop().toLowerCase();
          var blob = req.data instanceof Blob ? req.data : new Blob([req.data], { type: MIME[ext] || 'application/octet-stream' });
          var url = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = url; a.download = req.filename; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          resolve({ status: 'saved' });
        } catch (e) { reject({ code: 'unavailable' }); }
      });
    }
  });
  function periodRecords() {
    var p = $('period').value;
    return records.filter(function (r) { return p === 'all' || r.date.slice(0, 7) === p; })
      .sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : 0; });
  }
  function periodName() { var p = $('period').value; return p === 'all' ? 'todas' : p; }
  async function offer(filename, data) {
    var dl = await dlPromise;
    if (!dl) { $('status').textContent = 'Download indisponível nesta visualização.'; return; }
    try { await dl.save({ filename: filename, data: data }); $('status').textContent = 'Arquivo gerado: ' + filename; }
    catch (e) { $('status').textContent = e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível salvar o arquivo. Tente novamente.'; }
  }
  function safeCell(t) { t = String(t == null ? '' : t); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; }

  $('bCsv').addEventListener('click', function () {
    var list = periodRecords();
    if (!list.length) { $('status').textContent = 'Não há registros neste período.'; return; }
    var rows = [['Data', 'Local', 'Descrição', 'Valor (R$)', 'Situação']].concat(list.map(function (r) {
      return [br(r.date), r.place, r.desc, r.value.toFixed(2).replace('.', ','), r.paid ? 'Pago' : 'Pendente'];
    }));
    var csv = '﻿' + rows.map(function (row) { return row.map(safeCell).join(';'); }).join('\r\n');
    offer('diarias-' + periodName() + '.csv', csv);
  });

  $('bPdf').addEventListener('click', function () {
    var list = periodRecords();
    if (!list.length) { $('status').textContent = 'Não há registros neste período.'; return; }
    if (!window.jspdf) { $('status').textContent = 'O gerador de PDF não carregou. Verifique a conexão e recarregue a página.'; return; }
    var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    var X = { d: 15, l: 36, s: 76, v: 164, t: 168 }, y = 20;
    var p = $('period').value;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Cadern-11  |  Diárias trabalhadas', 15, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text((p === 'all' ? 'Todos os registros' : monthLabel(p)) + '  |  emitido em ' + br(ymd(new Date())), 15, y + 6);
    y += 15;
    function head() {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.text('Data', X.d, y); doc.text('Local', X.l, y); doc.text('Descrição', X.s, y); doc.text('Valor', X.v, y, { align: 'right' }); doc.text('Situação', X.t, y);
      doc.setDrawColor(60); doc.line(15, y + 2, 195, y + 2); y += 7;
      doc.setFont('helvetica', 'normal');
    }
    head();
    list.forEach(function (r) {
      var pl = doc.splitTextToSize(r.place, 38), ds = doc.splitTextToSize(r.desc || '-', 82 - 16);
      var lines = Math.max(pl.length, ds.length), h = lines * 4.4 + 2.5;
      if (y + h > 280) { doc.addPage(); y = 20; head(); }
      doc.text(br(r.date), X.d, y); doc.text(pl, X.l, y); doc.text(ds, X.s, y);
      doc.text(brl.format(r.value).replace(/ /g, ' '), X.v, y, { align: 'right' });
      doc.text(r.paid ? 'Pago' : 'Pendente', X.t, y);
      doc.setDrawColor(200); doc.line(15, y + h - 3.2, 195, y + h - 3.2);
      y += h;
    });
    var tot = sum(list), rec = sum(list.filter(function (r) { return r.paid; }));
    if (y + 24 > 285) { doc.addPage(); y = 20; }
    y += 5; doc.setFontSize(10);
    var f = function (v) { return brl.format(v).replace(/ /g, ' '); };
    doc.setFont('helvetica', 'normal'); doc.text(list.length + (list.length === 1 ? ' diária' : ' diárias'), 15, y);
    doc.text('Recebido: ' + f(rec), 195, y, { align: 'right' }); y += 6;
    doc.text('A receber: ' + f(tot - rec), 195, y, { align: 'right' }); y += 7;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Total: ' + f(tot), 195, y, { align: 'right' });
    offer('diarias-' + periodName() + '.pdf', doc.output('arraybuffer'));
  });

  $('bBackup').addEventListener('click', function () {
    if (!records.length) { $('status').textContent = 'Não há registros para guardar.'; return; }
    offer('caderneta-backup-' + ymd(new Date()) + '.json', JSON.stringify({ app: 'caderneta-diarias', version: 1, records: records }, null, 2));
  });
  $('bRestore').addEventListener('click', function () { $('restoreFile').click(); });
  $('restoreFile').addEventListener('change', function () {
    var file = this.files && this.files[0]; if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var data = JSON.parse(fr.result), arr = Array.isArray(data) ? data : data.records, added = 0;
        var ids = {}; records.forEach(function (r) { ids[r.id] = 1; });
        arr.forEach(function (r) {
          if (r && typeof r.id === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && typeof r.place === 'string' && isFinite(r.value) && !ids[r.id]) {
            records.push({ id: r.id, date: r.date, place: r.place, desc: String(r.desc || ''), value: Number(r.value), paid: !!r.paid }); ids[r.id] = 1; added++;
          }
        });
        persist(); render();
        $('status').textContent = added ? plural(added) + ' restaurada' + (added === 1 ? '' : 's') + '.' : 'Nenhum registro novo neste arquivo.';
      } catch (e) { $('status').textContent = 'Arquivo inválido. Escolha um backup salvo por este app.'; }
    };
    fr.readAsText(file); this.value = '';
  });

  $('today').textContent = cap(new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
  load(); render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
